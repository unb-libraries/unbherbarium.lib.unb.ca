dockworker:
  version: '6'
  drupal:
    schemas:
      ignore_enforcement:
        - bootstrap.settings
        - core.entity_form_display.node.herbarium_specimen.default
        - system.authorize.*
        - system.performance
        - system.rss.*
        - tvi.settings.*
        - tvi.taxonomy_vocabulary.herbarium_specimen_collector
        - tvi.taxonomy_vocabulary.herbarium_specimen_taxonomy
        - unbherbarium_admin_theme.settings.*
        - unbherbarium_ca.settings.*
        - update.settings
        - views.settings
        - views.view.browse
        - views.view.search_solr
        - views.view.banner
  application:
    name: Connell Memorial Herbarium
    uri: https://unbherbarium.lib.unb.ca
    description: >
      Connell Memorial Herbarium provides a searchable database of the vascular
      plant collections maintained at the  Connell Memorial Herbarium, and in-depth information about its policies,
      facilities and collections.
    topics:
      - herbarium
      - vascular plants
      - botany
      - research
    identifiers:
      id: unbherbarium.lib.unb.ca
      slug: unbherbarium-lib-unb-ca
      short_slug: herb
      uuid: 3081
    framework:
      name: Drupal
      version: 10
      startup_finished_marker: '99_startup_sequence_complete'
      endpoint:
        name: http
        port: 80
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  update:
    targets:
      - dir: build
        type: composer
  endpoints:
    env:
      - dev
      - prod
    deployments:
      unbherbarium-lib-unb-ca:
        default: true
        managed: true
        name: unbherbarium-lib-unb-ca
      drupal-mysql-lib-unb-ca:
        managed: false
        name: mysql
      drupal-redis-lib-unb-ca:
        managed: false
        name: redis
      drupal-solr-lib-unb-ca:
        managed: false
        name: solr
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: unbherbarium.lib.unb.ca
    jira:
      project_keys:
        - HERB
    image:
      name: ghcr.io/unb-libraries/unbherbarium.lib.unb.ca
      parent: ghcr.io/unb-libraries/drupal:11.x-1.x-unblib
      repository: GitHub
      push-branches:
        - dev
        - prod
    e2e_tests:
        - id: core
          frequency: '*/5 * * * *'
          source_files:
            - .dockworker/tests/e2e/unbherbarium.lib.unb.ca.yml
          namespaces:
            - prod
